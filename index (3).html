<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- FIXED missing > -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edmar games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Edmar game</h1>
  <p>Score: <span id="score">0</span></p>

  <div id="game-container">
    <canvas id="gc" width="400" height="400"></canvas>
  </div>

  <!-- Mobile Controls -->
  <div class="keys">
    <button onclick="Snake.action('up')">⬆️</button><br>
    <button onclick="Snake.action('left')">⬅️</button>
    <button onclick="Snake.action('down')">⬇️</button>
    <button onclick="Snake.action('right')">➡️</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
